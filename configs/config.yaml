# starter — Starter Pod (the smallest honest LeafMesh department)
#
# ─────────────────────────────────────────────────────────────────────
# READ THIS FILE TOP TO BOTTOM. It is a WORKING pod AND a tutorial. It is
# the *minimum* shape the house style calls a pod — a team, not a
# pipeline — so you can clone it, rename the roles, and grow your own
# department without unlearning anything.
#
#     pip install -r requirements.txt
#     docker run -d -p 6379:6379 redis:7-alpine      # state store
#     cp env .env  &&  edit .env  (LEAFMESH_LICENSE_KEY, OPENAI_API_KEY)
#     python validate_config.py                      # pre-flight check
#     python main.py                                 # API at :18820/docs
#
# Fire the example flow (day-0, against the seed store — no connector):
#
#     curl -X POST http://127.0.0.1:18820/api/mesh/request \
#       -H "Content-Type: application/json" \
#       -d '{"entry_point":"new_request",
#            "data":{"source":"manual","message":"What are your opening hours?"}}'
#
# ─────────────────────────────────────────────────────────────────────
# THE POD (the one mental model to internalise)
#
#   A pod is a TEAM: a specialist + a finisher + a human gate + a WORM
#   sink, watched by a supervisor. Not a pipeline.
#   • Intake (AI) reads a request, classifies it, and decides — fail
#     closed — whether a human must see it.
#   • Reviewer (human) is a first-class MEMBER, not an endpoint. Every
#     gate DEFAULT-DENIES on silence: nothing is sent or approved unless a
#     person says so.
#   • Resolver (the FINISHER) is the actuator: it re-checks that it is
#     actually authorised, enforces invariants a prompt can't waive,
#     renders the REAL artifact to ./out, and DELETES it on a blocked
#     floor — it never fakes a result.
#   • The audit sink is the WORM terminus of every path.
#   • The Manager SUPERVISES — it watches hand-offs and escalates real
#     failures (an error that retrying cannot fix, too many failed agents
#     in one session, restarts used up) to the human. It does NOT chase an
#     unanswered question, and a broken output contract only alerts people.
#     It is NOT a router in the middle of the team; the agents route
#     themselves via `can_call` wires, and each wire's `condition` IS the
#     business rule.
#
#   YAML-FIRST: topology, routing, prompts, and contracts all live here.
#   Python appears for exactly three things — an actuator with side
#   effects (the finisher), a control (the WORM sink), and the dev-store
#   tools — and nowhere else.
#
# Design doctrine: .claude/skills/leafmesh/building-agents-thoroughly.md
# Field reference:  .claude/skills/leafmesh/agent-config-fields.md
# Gotchas:          .claude/skills/leafmesh/nuances-and-gotchas.md
# ─────────────────────────────────────────────────────────────────────

name: "starter"
version: "1.0.0"
architecture: "managed_mesh"
environment: "development"
debug: true
log_level: "INFO"

# ── Agent auto-discovery. Any agency/<name>_agent.py whose function name
#    matches an agent below is auto-wired (binding is by NAME — a mismatch
#    is silent dead code, so keep them equal). Pure-YAML agents with no
#    module just work — the SDK derives their behaviour from prompt +
#    yields. This pod ships TWO modules: the finisher (an actuator) and
#    the intake floor (a control); everything else is declared here.
auto_discover:
  directory: "./agency"
  pattern: "*_agent.py"
  recursive: false

# ── The Manager — SUPERVISOR, not a router. It watches the event stream
#    and escalates to the targets below only when (leafmesh 2.4.486):
#      • an agent hits an error retrying cannot fix (auth, bad request,
#        out of credit, bad config) — on the first occurrence;
#      • max_errors_per_session different agents fail in one session;
#      • an agent's restart attempts are used up.
#    A question nobody answers is NOT escalated: the seat waits its time and
#    stops. A broken output contract only ALERTS people. Static routing
#    because this is a control path (approvals, audit) — nothing here
#    should be "learned". The agents route themselves through their wires.
manager:
  model: "gpt-4o-mini"
  domain: "generic"
  prompt: |
    This is a starter pod. A request arrives, intake_agent classifies it
    and decides — failing closed — whether a human must review it. Routine
    items go straight to the resolver; sensitive ones (money, complaints,
    anything low-confidence) go to reviewer_human first. The resolver
    produces the artifact only when it is genuinely authorised. Every
    decision a person or the finisher makes ends in the audit log.

    Escalate to reviewer_human when an agent fails with an error retrying
    cannot fix, or when several agents fail in the same session. A request
    the reviewer has not answered is not escalated; it waits and closes
    unanswered. Silence never advances a request.
  routing:
    mode: "static"          # control path — deterministic, reviewable
  escalation:
    targets:
      - type: human_agent
        agent: reviewer_human
    auto_escalate:
      max_retries: 3            # bounds the enforce_yields self-correction loop
      # 2 of this pod's 3 working agents failing in one request is systemic —
      # a person looks. (The default 5 could never trip in a 4-member pod.)
      max_errors_per_session: 2

timeouts:
  mesh_call_default_timeout_s: 120

# NOTE on 2.4.131 timeouts: the LLM hard timeout defaulted 300s → 90s in
# 2.4.131 and now lives in a `timeouts:` block, NOT the old env var. This
# pod's turns are short (one classification), so 90s is fine and we OMIT
# the block — omission is meaningful; we do not pre-fill defaults. A pod
# that runs long turns adds:  timeouts: { llm_hard_timeout_s: 300 }

# ─────────────────────────────────────────────────────────────────────
# DATA STRUCTURES — the canonical shape of a thing flowing through the
# pod. Optional, but declaring it documents the domain and lets the SDK
# validate entry payloads. `required:` lists the fields an entry MUST carry.
# ─────────────────────────────────────────────────────────────────────
data_structures:
  Request:
    type: "object"
    properties:
      request_id:  { type: "string" }
      source:      { type: "string" }   # manual | email | webform | api
      message:     { type: "string" }
      requester:   { type: "string" }   # email / name — used for the dev-store lookup
      received_at_utc: { type: "string" }
    required: ["source"]

# ─────────────────────────────────────────────────────────────────────
# ENTRY POINTS — every real-world trigger that can START work. Name them
# after the TRIGGER (what happened in the world), point them at the agent
# that owns the first decision. A pod has many doors.
# ─────────────────────────────────────────────────────────────────────
entry_points:
  - name: "new_request"
    target: "intake_agent"
    description: "A new request arrives (form, email, manual entry)."
    condition: always

  - name: "direct_call_intake"
    target: "intake_agent"
    description: "Run intake on one payload directly (debug / replay / programmatic ingest)."
    condition: always

  # HITL resume — the reviewer answers in Studio's Inbox and the pod
  # continues from the gate. A door a PERSON opens, mid-flow.
  - name: "reviewer_reply"
    target: "reviewer_human"
    description: "The reviewer approves / rejects a held request — resumes the flow."
    condition: always

  # ── PATTERN: a scheduled door (cron). Uncomment the matching agent's
  #    `wake_up:` (PATTERN C at the foot of this file) to enable — here before
  #    the first start, in Studio's YAML editor after it. A door that TIME
  #    opens, not a person.
  # - name: "nightly_sweep"
  #   target: "sweep_agent"
  #   description: "Nightly housekeeping sweep of aging requests."
  #   condition: always

# ─────────────────────────────────────────────────────────────────────
# AGENTS — the team.
# ─────────────────────────────────────────────────────────────────────
agents:

  # ── 1) INTAKE — the triage specialist (AI, chain) ────────────────
  # Reads an incoming request, looks the requester up in the system of
  # record, classifies it, and decides — FAILING CLOSED — whether a human
  # must see it. `communication_type: chain` because it is an AI peer, not
  # a human boundary (dual belongs only on the human agent below).
  #
  # The wires under `can_call:` ARE the routing policy. Read them like
  # business rules: "needs a human → reviewer; routine → resolver."
  #
  # This agent has a backing module (agency/intake_agent.py) for ONE
  # reason: a `@chain` floor that the prompt cannot talk its way past —
  # a sensitive category, a high priority, a confidence below 0.7 or a
  # routine item with no draft is FORCED to a human,
  # and the request is stashed so the finisher can recover it across the
  # HITL gap. The model decides; the code fails closed.
  intake_agent:
    name: "intake_agent"
    agent_type: "llm"
    description: "Intake & triage desk — classifies a request and decides, fail-closed, if a human must review it."
    model: "gpt-4o-mini"
    temperature: 0.1
    communication_type: "chain"
    prompt: |
      You are the intake desk. Read the incoming request and classify it.
      If you are given a requester (email/name), look them up FIRST with
      the lookup tool — a known, high-tier requester changes how you
      prioritise. Load the `triage` playbook for how to classify well.

      Decide:
        - category: one of [question, complaint, refund, other]
        - priority: one of [low, normal, high]
        - needs_human: true whenever the request involves money, a
          complaint, or ANYTHING you cannot answer with confidence.
          When in doubt, choose true — a human reviewing a routine item
          is cheap; auto-resolving a sensitive one is not.
        - draft_reply: a short, polite reply IF needs_human is false;
          otherwise leave it empty (a human will write it).
        - summary: one sentence a human reviewer could act on.
        - confidence: 0.0–1.0, how sure you are of the category. Below
          0.7 the request goes to a human whatever you decided.

      Echo `request_id` from the input unchanged if present so downstream
      steps stay addressable (the floor mints one if it is missing).

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly
      these keys:
      {"category": "", "priority": "", "needs_human": false, "draft_reply": "", "summary": "", "confidence": 0.0, "request_id": ""}

    # enforce_yields makes `yields:` a hard contract: on a bad-shape
    # response the Manager retries the agent with the validation error
    # (bounded by manager.auto_escalate.max_retries above).
    enforce_yields: true
    enforce_yields_retry: 2

    # `yields:` doubles as the structured-output schema AND the set of
    # fields the wires below (and downstream agents) may reference.
    yields:
      category: "string"
      priority: "string"
      needs_human: "boolean"
      draft_reply: "string"
      summary: "string"
      confidence: "number"      # < 0.7 → forced to a human by the floor
      request_id: "string"

    inputs:
      message: "string"
      source: "string"
      requester: "string"

    # ── MODERN FEATURE (live): a per-intent PLAYBOOK. Only the `description`
    #    rides in the prompt every turn; the `responsibility` body is fetched
    #    on demand when the model recognises the intent — the craft is not
    #    resident, so it does not compete with the persona for attention.
    #    (Requires leafmesh>=2.4.130: per-agent playbook registry.)
    playbook:
      - intent: triage
        description: "How to classify an incoming request and decide if a human must see it."
        responsibility: |
          1. If a requester was given, call lookup_requester FIRST — their
             tier / open-ticket history changes priority. If the lookup is
             unavailable (available:false), say so; do NOT invent a tier.
          2. Classify category from the message's INTENT, not its keywords:
             a refund demand phrased as a question is still a refund.
          3. needs_human is a SAFETY decision, not a convenience one. Money
             (refund), dissatisfaction (complaint), high priority and low
             confidence (below 0.7) all force a human — the floor enforces
             it. Only [question, other] you can answer plainly are routine.
          4. If routine, write the draft_reply now — a routine item with no
             draft cannot be auto-resolved and the floor will send it to a
             human anyway.
        variables: [request_id]

    # ── Day-0 tool surface — reads the seed system-of-record so the pod
    #    runs with NO connector wired. The tool ANNOUNCES ITSELF: when there
    #    is no real source and no seed, it returns available:false and says
    #    why — never a synthetic success. See agency/tools.py.
    tools: [lookup_requester]
    tool_categories: [intake]
    # NOTE: intake's tool chain is short (lookup + playbook), well under the
    # default max_tool_calls_per_message of 5. An agent with a LONG read/act
    # chain must raise it (default 5 TRUNCATES SILENTLY; 20 is the ceiling) —
    # e.g. the reference extraction agent sets max_tool_calls_per_message: 15.

    # ── To wire your real system of record (CRM / helpdesk): create the
    #    vault connection 'crm_mcp' on Infrastructure → Integrations → MCP
    #    (the MCP server's URL + token live there, never here), then
    #    uncomment (here before the first start, in Studio's YAML editor
    #    after it; applies live) — each named action under `use:` becomes its own tool
    #    (e.g. crm_get_customer). The dev-store tool above is the fallback
    #    contract until then. (MCP tools are namespaced <server>_<tool> and
    #    merge in automatically — do NOT also list them under `tools:`.)
    # mcp:
    #   - connection: crm_mcp   # vault connection holds the URL + token
    #     transport: http
    #     use: [get_customer, list_tickets]
    #     name: crm
    #     timeout: 30

    can_call:
      # Needs a human → the reviewer gate.
      - agent: "reviewer_human"
        condition: "calling_agent_response.needs_human == true"
      # Routine → the finisher issues it directly (it re-checks anyway).
      - agent: "resolver_agent"
        condition: "calling_agent_response.needs_human == false"

    auto_store_response: true
    auto_store_yields: true

  # ── 2) REVIEWER — the HITL gate (human, dual, first-class MEMBER) ─
  # A real person in the loop, answering in Studio's Inbox (or, with a
  # webhook_config: {connection: <vault record>}, an external tool).
  # `communication_type: dual`
  # belongs HERE and only here — the human/webhook boundary. Its wires
  # target CHAIN peers, never another dual agent (dual→dual is unbounded
  # ping-pong the SDK warns on).
  #
  # DEFAULT-DENY on silence: if no one answers in time, the flow does NOT
  # auto-approve. On leafmesh 2.4.486 this seat is "dual", and a dual seat's
  # timeout routes nothing: after human_timeout_seconds the Inbox card
  # closes and the ticket records that no reply came. Nothing is sent or
  # approved on silence, and nobody is chased automatically.
  # The fallback below is the declared intent — a NON-approving verdict
  # (held_for_review) that matches the audit route. It does not route
  # today; it is kept so the route is ready if the SDK starts sending a dual
  # seat's fallback on.
  #
  # A human reply is delivered as `human_message` (+ other human_* meta),
  # NOT as declared yields — so every wire condition here reads
  # `calling_agent_response.human_message`.
  reviewer_human:
    name: "reviewer_human"
    agent_type: "human"
    is_human_powered: true
    description: "Request reviewer & accountable owner — approves or declines sensitive requests before any reply goes out."
    human_interface: "default"   # the Inbox (no vault connection needed)
    communication_type: "dual"
    human_timeout_seconds: 86400          # 24 h — one business day for a support lead to decide

    # operator_ids: ["you@yourcompany.com"]   # optional. UNSET = shared
    #   inbox (everyone sees it). Only set REAL emails — a placeholder
    #   assigns the task to a nonexistent person and it lands in no inbox.

    # Default-deny: on timeout the reviewer is treated as having HELD the
    # request for manual review — the fallback's human_message matches the
    # 'held_for_review' route below, never an approval. (2.4.486: see the
    # note above — today the card closes and nothing routes.)
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review

    yields:
      human_message: "string"
    inputs:
      summary: "string"
      request_id: "string"

    human_prompt_template: |
      Review request {{request_id}} before any reply goes out.
      Reply "approve" to resolve it, "reject" to decline.
      Summary: {{summary}}

    can_call:
      # Approved → the finisher issues the resolution.
      - agent: "resolver_agent"
        condition: "calling_agent_response.human_message == 'approve'"
      # Rejected or held (incl. the declared timeout fallback) → straight to audit.
      - agent: "audit_logger_agent"
        condition: "calling_agent_response.human_message == 'reject' or calling_agent_response.human_message == 'held_for_review'"

  # ── 3) RESOLVER — the FINISHER / actuator (programmatic) ─────────
  # The agent AFTER the human gate that produces the REAL artifact. It is
  # the concrete "@chain fails closed" (see agency/resolver_agent.py):
  #   a) authorisation RE-CHECK — reaching this agent does NOT mean allowed.
  #      An approve-token allowlist + a block-token denylist; the routine
  #      path is gated by an auto-resolvable-category allowlist. An UNKNOWN
  #      verdict or category fails closed.
  #   b) deterministic invariants a prompt can't waive (a recovered request,
  #      an addressable id, something to actually say).
  #   c) render the real resolution record to ./out; on a tripped floor,
  #      DELETE the partial and record status:blocked with reasons — never a
  #      half-issued result.
  #   d) dev-store recovery — after the HITL gate the upstream payload is
  #      dropped, so the finisher recovers the request from the session
  #      stash / dev store, and records to a verifiable ./data outbox that
  #      ANNOUNCES it is a dev-store record (it never fakes a real send ack).
  # No prompt, no model — it is code with side effects, exactly what Python
  # is for.
  resolver_agent:
    name: "resolver_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Resolution finisher — re-checks authorisation, enforces invariants, renders the artifact to ./out, WORM-logs it."
    yields:
      issued: "boolean"
      approved: "boolean"
      artifact_path: "string"
      status: "string"          # issued | blocked
      block_reasons: "array"
    can_call:
      - agent: "audit_logger_agent"
        condition: "always"

  # ── 4) AUDIT SINK — WORM terminus (external, custom) ─────────────
  # Hash-chained, append-only, tamper-evident. The ONE control this
  # starter ships as Python that isn't an actuator (agency/_shared/
  # audit_logger.py), registered in main.py via sdk.intelligence(). Every
  # decided path ends here — an issued resolution, a blocked one, a
  # rejection, a hold. (A request nobody answered is recorded on its ticket,
  # not here, on 2.4.486.) Leave it; it is your compliance backbone.
  audit_logger_agent:
    name: "audit_logger_agent"
    agent_type: "external"
    description: "Hash-chained WORM audit — the immutable terminus of every path."
    framework: "custom"
    communication_type: "chain"
    connector_config:
      sink_type: "local_file"
      local_file_path: "./logs/audit.jsonl"
    yields:
      audit_event_id: "string"
      written_at_utc: "string"
      hash_chain_prev: "string"
      hash_chain_current: "string"
    inputs:
      session_id: "string"
      payload: "object"
    can_call: []          # terminal — the buck stops here

  # ─────────────────────────────────────────────────────────────────
  # PATTERNS TO GROW INTO — copy, uncomment, rename (here before the first
  # start, in Studio's YAML editor after it). Commented out so the
  # pod runs clean; validate_config.py checks them once enabled.
  # ─────────────────────────────────────────────────────────────────

  # ── PATTERN A: a second specialist the intake can hand routine work to,
  #    e.g. a drafter that writes the customer-facing reply before the
  #    finisher issues it. Keep it `chain` (an AI peer, never dual). Add a
  #    wire intake_agent → responder_agent (needs_human == false) and
  #    responder_agent → resolver_agent.
  #
  # responder_agent:
  #   name: "responder_agent"
  #   agent_type: "llm"
  #   description: "Drafts the customer-facing reply for routine requests"
  #   model: "gpt-4o-mini"
  #   temperature: 0.3
  #   communication_type: "chain"
  #   prompt: |
  #     Write a warm, concise reply from the intake summary and draft.
  #     OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly
  #     these keys:
  #     {"reply_text": "", "request_id": ""}
  #   enforce_yields: true
  #   yields:
  #     reply_text: "string"
  #     request_id: "string"
  #   can_call:
  #     - agent: "resolver_agent"
  #       condition: "always"

  # ── PATTERN B: a fanned-out BACKLOG worker — the `scaling.copies` modern
  #    feature. One activation → N parallel copies in the same session.
  #    Give the copies an ATOMIC CLAIM tool (an LPOP / SELECT … SKIP LOCKED)
  #    so each pulls a DISJOINT batch — without it, copies duplicate work
  #    and the merge honestly shows two identical items. Do NOT multiply
  #    triggers (a 3-line wake_up × copies.count:3 = 9 runs).
  #
  # backlog_worker_agent:
  #   name: "backlog_worker_agent"
  #   agent_type: "llm"
  #   description: "Clears the aging-request backlog in parallel"
  #   model: "gpt-4o-mini"
  #   communication_type: "chain"
  #   scaling:                    # 2.4.484 (was instances / instances_handoff)
  #     copies:
  #       mode: fixed
  #       count: 3               # 3 copies per activation
  #       handoff: last          # last = COMBINE + route once (default); each = route N times
  #   tools: [claim_requests]      # the atomic claim splits the backlog between copies
  #   prompt: |
  #     Claim a batch of aging requests and summarise each.
  #     OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly
  #     these keys:
  #     {"handled_ids": [], "handled_count": 0}
  #   yields:
  #     handled_ids: { type: "array", items: { type: "string" } }
  #     handled_count: "number"
  #   can_call:
  #     - agent: "audit_logger_agent"
  #       condition: "always"

  # ── PATTERN C: a SCHEDULED agent (cron). `wake_up:` is a 5-field cron.
  #    Nobody calls it — TIME does. Pair it with the matching entry_point
  #    above. ALWAYS set `timezone:` next to a live wake_up — a cron with
  #    no timezone fires in UTC, so "0 9 * * *" runs at 14:30 IST, not 9am
  #    local. Keep crons commented until the agent's dependencies are
  #    actually wired, or the schedule just fills the logs with errors.
  #
  # sweep_agent:
  #   name: "sweep_agent"
  #   agent_type: "llm"
  #   description: "Summarises aging requests for the team each morning"
  #   model: "gpt-4o-mini"
  #   communication_type: "chain"
  #   wake_up: "0 8 * * *"          # every day at 08:00 …
  #   timezone: "Asia/Kolkata"      # … in THIS zone, not UTC (IANA name)
  #   prompt: |
  #     Summarise the day's aging requests into a short team digest.
  #     OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly
  #     these keys:
  #     {"digest": "", "total_requests": 0}
  #   yields:
  #     digest: "string"
  #     total_requests: "number"
  #   can_call:
  #     - agent: "audit_logger_agent"
  #       condition: "always"

  # ── PATTERN D: turn a specialist into a SUPER-AGENT for autonomous
  #    multi-step work (plan → execute → verify → reflect → finalize).
  #    Tune it with the DICT form — the old flat super_agent_* keys are only
  #    a legacy fallback, and the LEAFMESH_SUPER_AGENT_* env vars are not
  #    read. Enable it for
  #    research/synthesis/multi-file work, NOT for one-shot classification
  #    (intake stays a plain LLM agent — faster and cheaper).
  #
  #   super_agent:
  #     cost_ceiling: 100000        # aggregate token budget per run (default 50000)
  #     wall_clock: 900             # per-run wall-clock seconds (default 600)
  #     step_concurrency: 4         # parallel plan steps when the DAG allows
